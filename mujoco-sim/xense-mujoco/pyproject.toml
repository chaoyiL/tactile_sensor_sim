[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://xensedoc.readthedocs.io/en/latest/"
documentation = "https://xensedoc.readthedocs.io/en/latest"
issues = "https://github.com/XenseRobotics/xensesdk/issues"

[project]
name = "xense-mujoco"
version = "0.0.1"
description = "xense simulation integration with mujoco & MJX & mujoco playground"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
  { name = "Jin Liu", email = "liujin@xenserobotics.com" },
  { name = "Hongzhan Yu", email = "yuhongzhan@xenserobotics.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = ["xense robotics", "mujoco"]

dependencies = [
    "mujoco",
    "numpy"
]

# [project.scripts]
# xensegripper = "xensegripper.__main__:main"
[tool.setuptools]
include-package-data = true  # 打开包含包内非 .py 文件

[tool.setuptools.packages.find]
where = ["src"]

# 打包数据文件（等价于你的 package_data）
[tool.setuptools.package-data]
xensemujoco = [
  "assets/**",
]

# 如果还需要把非 .py 的资源一起打包，可用：
# [tool.setuptools.include-package-data]
# include-package-data = true
